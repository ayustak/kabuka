[project]
name = "kabuka-backend"
version = "0.1.0"
description = "日本株予測・売買シグナル kabuka のバックエンド（まず無料データでファクター検証）"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2",   # 無料の株価(配当・分割調整済)取得
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",     # pandas の Spearman相関(IC計算)に必要
    "pyarrow>=15",     # parquetキャッシュ
    "fastapi>=0.115",  # API層
    "uvicorn>=0.30",   # ASGIサーバ
    "apscheduler>=3.10",  # 日次スケジューラ
]

[project.optional-dependencies]
# LightGBM はmacOSで `brew install libomp` が必要
model = ["lightgbm", "scikit-learn", "optuna"]
db = ["sqlalchemy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
