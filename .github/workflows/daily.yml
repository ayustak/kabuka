name: kabuka 日次パイプライン

# 平日 18:30 JST (= 09:30 UTC) に自動実行。手動実行も可。
on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # reco_log 等をコミットして戻すため

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # データキャッシュ（増分更新を速くする。失われてもJ-Quantsから再取得可）
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: backend/data
          key: kabuka-data-${{ github.run_id }}
          restore-keys: kabuka-data-

      - name: Install deps
        working-directory: backend
        run: pip install -e .

      - name: Run daily pipeline
        working-directory: backend
        env:
          KABUKA_JQUANTS_API_KEY: ${{ secrets.KABUKA_JQUANTS_API_KEY }}
          KABUKA_EDINET_KEY: ${{ secrets.KABUKA_EDINET_KEY }}
        run: python -m app.scheduler.jobs

      # ライブ推奨実績（再生成不可）をリポジトリに保存
      - name: Commit forward-track log
        run: |
          git config user.name "kabuka-bot"
          git config user.email "kabuka-bot@users.noreply.github.com"
          git add -f backend/data/reco_log.parquet backend/data/strategy_summary.json backend/data/signals_latest.json 2>/dev/null || true
          git commit -m "chore: 日次フォワード実績の記録 $(date -u +%Y-%m-%d)" || echo "変更なし"
          git push || echo "push不要"
