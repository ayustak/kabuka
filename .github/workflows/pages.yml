name: Pages デプロイ

# 日次パイプライン完了後（最新データ反映後）／web変更のpush／手動 で実行。
on:
  workflow_run:
    workflows: ["kabuka 日次パイプライン"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/scripts/export_web.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: pip install -e .
      - name: Build caches（sim_px/sim_scores/sim_topix 等を生データから再生成）
        working-directory: backend
        run: python scripts/build_dashboard_data.py
      - name: Build web data（推奨/精度/最新株価/シミュ結果/解説をJSON・HTML化）
        working-directory: backend
        run: python scripts/export_web.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pagesを自動で有効化（手動設定不要に）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
